<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compliance Portal</title>
<meta name="description" content="ADHICS policies, HR documents and the LEGAL REGISTER – sign in to the Compliance Portal.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0a0a; --ink: #fff; --muted: #9b958f; --brand: #ff5101; --line: rgba(255, 240, 225, .1); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(70% 60% at 50% 120%, rgba(255, 81, 1, .45), transparent 65%), var(--bg);
    color: var(--ink); font: 15px/1.5 Inter, "Segoe UI", system-ui, sans-serif; overflow: hidden; padding: 24px 16px; }
  .globe { position: fixed; left: 50%; bottom: -260px; width: 560px; height: 420px; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 130, 50, .95) 1.3px, transparent 1.9px) 0 0 / 9px 9px;
    -webkit-mask: radial-gradient(closest-side, #000 60%, transparent 100%); mask: radial-gradient(closest-side, #000 60%, transparent 100%);
    filter: drop-shadow(0 0 14px rgba(255, 81, 1, .7)); animation: drift 40s linear infinite; pointer-events: none; }
  .ring { position: fixed; left: 50%; bottom: -380px; width: 820px; height: 520px; transform: translateX(-50%); border-radius: 50%; border: 1px solid rgba(255, 110, 40, .35);
    box-shadow: 0 0 0 60px rgba(255, 81, 1, .03), 0 0 0 61px rgba(255, 110, 40, .16); pointer-events: none; }
  @keyframes drift { to { background-position: 360px 0; } }
  main { position: relative; z-index: 1; text-align: center; max-width: 560px; }
  .mark { width: 46px; height: 46px; margin: 0 auto 22px; border-radius: 14px; background: linear-gradient(135deg, #ff5101, #ffae6b); box-shadow: 0 0 26px -4px rgba(255, 81, 1, .9); }
  h1 { margin: 0; font-weight: 500; font-size: clamp(32px, 6vw, 48px); letter-spacing: -.025em; line-height: 1.1; }
  h1 span { display: block; color: #8f8a85; }
  p { color: var(--muted); margin: 16px 0 28px; }
  a.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px; background: var(--brand); color: #fff; text-decoration: none; font-weight: 500;
    box-shadow: 0 0 30px -6px rgba(255, 81, 1, .9); }
  a.btn[aria-disabled="true"] { background: #2a2725; box-shadow: none; pointer-events: none; color: var(--muted); }
  small { display: block; margin-top: 18px; color: #6f6a65; font-size: 12.5px; }
  @media (prefers-reduced-motion: reduce) { .globe { animation: none; } }
</style>
</head>
<body>
<div class="ring"></div><div class="globe"></div>
<main>
  <div class="mark"></div>
  <h1>Compliance Portal<span>policies, HR &amp; LEGAL REGISTER</span></h1>
  <p id="msg">Opening the portal…</p>
  <a class="btn" id="go" href="https://api.trycloudflare.com">Open the portal →</a>
  <small id="when">Link updated 10 Nov 2026, 12:37 (UAE)</small>
</main>
<script>
  // The portal runs on the facility's PC; its address can change. link.json always holds the current one.
  (async () => {
    let url = 'https://api.trycloudflare.com', online = true;
    try {
      const r = await fetch('link.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) { const j = await r.json(); url = j.url || url; online = j.online !== false; document.getElementById('when').textContent = 'Link updated ' + (j.updated || ''); }
    } catch (e) { /* use the address written into this page */ }
    const go = document.getElementById('go'), msg = document.getElementById('msg');
    if (!online || !url) { msg.textContent = 'The portal is offline right now – the computer that runs it is switched off. Please try again later.'; go.setAttribute('aria-disabled', 'true'); return; }
    go.href = url + '/login.html';
    msg.textContent = 'Opening the portal…';
    setTimeout(() => { location.replace(url + '/login.html'); }, 900);
  })();
</script>
</body>
</html>
